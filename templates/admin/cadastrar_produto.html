
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Produto - Folha D'Água</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>

<body>

    <div class="admin-container">

        <!-- MENU LATERAL -->
        <aside class="sidebar">

            <div class="logo">
                🌷
                <h2>Folha D'Água</h2>
                <span>Administrador</span>
            </div>

            <nav>
                <a href="#">Dashboard</a>
                <a href="#" class="ativo">Produtos</a>
                <a href="#">Estoque</a>
                <a href="#">Encomendas</a>
                <a href="#">Clientes</a>
            </nav>
        </aside>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="conteudo">
            <header class="topo">
                <div>
                    <h1>Cadastrar Produto</h1>
                    <p>Adicione um novo produto ao catálogo.</p>
                </div>
            </header>

            <!-- FORMULÁRIO -->
            <section class="formulario-container">
                <form action="/admin/produtos/cadastrar" method="POST">

                    <div class="campo">
                        <label for="tipo_produto">Tipo do produto</label>

                        <select id="tipo_produto" name="tipo_produto" required>
                            <option value="">Selecione o tipo</option>
                            <option value="Buquê">Buquê</option>
                            <option value="Arranjo">Arranjo</option>
                             <option value="Arranjo">Flor individual</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="nome_flor">Nome do produto</label>
                        <input type="text" id="nome_flor" name="nome_flor" placeholder="Ex: Rosas Vermelhas" required>
                    </div>

                    <div class="linha">

                        <div class="campo">
                            <label for="preco">Preço</label>
                            <input type="number" id="preco" name="preco" placeholder="0.00" step="0.01" min="0"
                                required>
                        </div>

                        <div class="campo">
                            <label for="estoque">Estoque</label>
                            <input type="number" id="estoque" name="estoque" placeholder="Quantidade" min="0" required>
                        </div>

                    </div>

                    <div class="botoes">
                        <a href="/" class="botao cancelar">Cancelar</a>

                        <button type="submit" class="botao cadastrar">
                            Cadastrar Produto
                        </button>
                    </div>
                </form>
            </section>
        </main>
    </div>

</body>

</html>
